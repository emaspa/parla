[package]
name = "parla-ui"
description = "parla's desktop UI: recording overlay, tray icon, settings, dictionary, snippets, history"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "parla-ui"
path = "src/main.rs"

[[bin]]
name = "parla-mockd"
path = "src/bin/parla-mockd.rs"

[dependencies]
parla-flow = { path = "../flow" }
anyhow = { workspace = true }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[build-dependencies]
cxx-qt-build = "0.10"
