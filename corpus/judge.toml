# Calibration corpus for the judged path: `parlad --calibrate corpus/judge.toml`.
#
# `[state]` is a synthetic desktop. Every case is judged against it, never
# against the machine running the tool. The cases are utterances the grammar
# does not match (the tool reports and skips any that do), each with what the
# judge ought to make of it:
#
#   say            the utterance, as whisper would transcribe it
#   expect         an intent name as the judge uses them, or "dictation" for
#                  prose, or "unclear" for what should be refused
#   accept         further intent names that are also right (used sparingly)
#   target         substring of the window title, window class, application
#                  name or desktop id that must be resolved; "focused" for the
#                  window with focus
#   desktop        the desktop number a virtual_desktop must name
#   direction      next or previous, for virtual_desktop_rel
#   payload        the text a claude_tell, notify, krunner or key must carry;
#                  a leading "to", "that" or "the" in what was resolved is
#                  tolerated
#   model          opus, sonnet or haiku, for start_claude and claude_model
#   last_dictation judge as if text was just dictated, so edit_text is offered
#   destructive    whether the model ought to flag the action as destructive

[state]
desktop_count = 4
current_desktop = 2
claude_running = true

